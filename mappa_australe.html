<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il Cielo Australe — Firmamentum Sobiescianum</title>
<style>
  :root{
    --parchment:#f4ecd8;
    --ink:#5a4632;
    --ink-soft:#7a6650;
    --night:#0a1430;
    --ivory:#f3ecd8;
    --gold:#c9a227;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--night);color:var(--ivory);font-family:Georgia,'Times New Roman',serif;}
  header.site{
    background:var(--night);
    padding:14px 28px;
    display:flex;align-items:baseline;gap:22px;
    border-bottom:1px solid rgba(201,162,39,.45);
  }
  header.site .brand{font-size:1.15rem;letter-spacing:.06em;color:var(--gold);text-decoration:none;}
  header.site nav a{color:var(--ivory);text-decoration:none;font-size:.92rem;opacity:.85;}
  header.site nav a:hover{color:var(--gold);opacity:1;}
  .titleblock{text-align:center;padding:26px 16px 4px;}
  .titleblock h1{
    margin:0;font-size:2rem;font-weight:normal;letter-spacing:.14em;
    color:var(--ivory);font-variant:small-caps;
  }
  .titleblock .subtitle{margin-top:6px;font-style:italic;color:#cbbd9a;font-size:1.02rem;}
  .titleblock .nota{margin-top:4px;font-size:.8rem;color:#9a8f74;letter-spacing:.05em;}
  .mapwrap{
    max-width:1060px;margin:10px auto 40px;padding:0 12px;
  }
  svg#sky{width:100%;height:auto;display:block;background:var(--parchment);
    border-radius:6px;box-shadow:0 3px 18px rgba(0,0,0,.5);}
  .grat{fill:none;stroke:var(--ink);stroke-width:.5;opacity:.28;}
  .grat-par{fill:none;stroke:var(--ink);stroke-width:.5;opacity:.28;}
  .label-bg{fill:#faf4e4;fill-opacity:.75;stroke:none;pointer-events:none;}
  .rim-outer{fill:none;stroke:var(--ink);stroke-width:2;}
  .rim-inner{fill:none;stroke:var(--ink);stroke-width:.8;}
  .tick{stroke:var(--ink);stroke-width:.8;opacity:.8;}
  .ralabel{fill:var(--ink);font-size:15px;font-variant:small-caps;letter-spacing:.08em;}
  .pole-dot{fill:var(--ink);}
  .pole-label{fill:var(--ink);font-size:13px;font-variant:small-caps;letter-spacing:.1em;text-anchor:middle;}
  .cst{fill:#faf4e4;fill-opacity:.55;stroke:transparent;stroke-width:0;cursor:pointer;}
  .cst:hover{fill:#e6c97a;fill-opacity:.5;stroke:#8a6f4d;stroke-width:1.4;}
  .cst.noclick{cursor:default;}
  .cst.noclick:hover{fill:#faf4e4;fill-opacity:.55;stroke:transparent;stroke-width:0;}
  .lines{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-opacity:.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}
  .cname{fill:var(--ink);font-size:10.5px;font-variant:small-caps;letter-spacing:.12em;
    text-anchor:middle;pointer-events:none;opacity:.92;}
  footer{max-width:1060px;margin:0 auto 30px;padding:0 16px;color:#8d836b;font-size:.82rem;font-style:italic;}
</style>
</head>

<script>
(function(){
  "use strict";
  var B = JSON.parse(document.getElementById('boundaries').textContent);
  var L = JSON.parse(document.getElementById('lines').textContent);
  var S = JSON.parse(document.getElementById('slugs').textContent);

  var CX = 500, CY = 500, R = 430;
  var EDGE_DEC = 20;                       // bordo esterno: declinazione +20°
  var K = Math.tan((Math.PI/180) * (90 + EDGE_DEC) / 2);  // tan(55°): normalizza il raggio al bordo
  var D2R = Math.PI/180;

  function normRA(ra){ ra = ra % 360; if (ra < 0) ra += 360; return ra; }

  // Proiezione stereografica polare SUD: polo sud celeste al centro,
  // RA in senso ORARIO (come visto dall'emisfero sud), 0h in alto.
  function proj(ra, dec){
    var th = normRA(ra) * D2R;
    var c = (90 + dec) * D2R;              // distanza angolare dal polo sud
    var r = Math.tan(c/2) / K * R;
    // orario visto dall'emisfero sud (speculare alla boreale)
    var x = CX + r * Math.sin(th);
    var y = CY - r * Math.cos(th);
    return [x, y];
  }

  function f(n){ return (Math.round(n*100)/100).toString(); }

  function polyPath(rings){
    var d = '';
    for (var i=0;i<rings.length;i++){
      var pts = rings[i];
      if (pts.length < 3) continue;
      for (var j=0;j<pts.length;j++){
        var p = proj(pts[j][0], pts[j][1]);
        d += (j===0 ? 'M' : 'L') + f(p[0]) + ',' + f(p[1]);
      }
      var p0 = proj(pts[0][0], pts[0][1]);
      d += 'L' + f(p0[0]) + ',' + f(p0[1]) + 'Z';
    }
    return d;
  }

  function linePath(segs){
    var d = '';
    for (var i=0;i<segs.length;i++){
      var pts = segs[i];
      if (pts.length < 2) continue;
      for (var j=0;j<pts.length;j++){
        var p = proj(pts[j][0], pts[j][1]);
        d += (j===0 ? 'M' : 'L') + f(p[0]) + ',' + f(p[1]);
      }
    }
    return d;
  }

  // centroide d'area (shoelace) del poligono, per l'etichetta
  function centroid(rings){
    var best = null, bestA = 0;
    for (var i=0;i<rings.length;i++){
      var pts = rings[i], a = 0, cx = 0, cy = 0;
      for (var j=0;j<pts.length;j++){
        var p1 = proj(pts[j][0], pts[j][1]);
        var p2 = proj(pts[(j+1)%pts.length][0], pts[(j+1)%pts.length][1]);
        var cross = p1[0]*p2[1] - p2[0]*p1[1];
        a += cross; cx += (p1[0]+p2[0])*cross; cy += (p1[1]+p2[1])*cross;
      }
      a /= 2;
      if (Math.abs(a) > Math.abs(bestA)){ bestA = a; best = [cx/(6*a), cy/(6*a)]; }
    }
    return best || [CX, CY];
  }

  var svg = document.getElementById('sky');
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // ---- sfondo e griglia ----
  svg.appendChild(el('circle', {cx:CX, cy:CY, r:R+8, fill:'#efe5cc'}));

  // meridiani ogni 2h (dal bordo dec +20 fino quasi al polo sud)
  for (var h=0; h<24; h+=2){
    var ra = h*15, d = '';
    for (var dec=EDGE_DEC; dec>=-88; dec-=4){
      var p = proj(ra, dec);
      d += (dec===EDGE_DEC?'M':'L') + f(p[0]) + ',' + f(p[1]);
    }
    svg.appendChild(el('path', {'class':'grat', d:d}));
  }
  // paralleli ogni 30°
  [0,-30,-60].forEach(function(dec){
    var d = '';
    for (var h=0; h<=360; h+=3){
      var p = proj(h, dec);
      d += (h===0?'M':'L') + f(p[0]) + ',' + f(p[1]);
    }
    svg.appendChild(el('circle', {'class':'grat-par', cx:CX, cy:CY,
      r: f(Math.tan((90-dec)*D2R/2)/K*R)}));
  });

  // ---- clip: nulla puo' uscire dal cerchio della mappa ----
  var defs = el('defs', {});
  var clip = el('clipPath', {id:'clip-circle'});
  clip.appendChild(el('circle', {cx:CX, cy:CY, r:R}));
  defs.appendChild(clip);
  svg.appendChild(defs);

  // ---- poligoni ----
  var gPoly = el('g', {'clip-path':'url(#clip-circle)'});
  svg.appendChild(gPoly);
  var codes = Object.keys(B);
  codes.forEach(function(code){
    var info = B[code];
    var slugObj = S[code];
    var clickable = !!(slugObj && slugObj.slug);
    var p = el('path', {'class': clickable ? 'cst' : 'cst noclick', d: polyPath(info.poly)});
    if (clickable){
      p.addEventListener('click', function(){
        window.location.href = 'constellation.html?c=' + encodeURIComponent(slugObj.slug);
      });
      var t = el('title', {});
      t.textContent = info.name;
      p.appendChild(t);
    } else {
      console.warn('[mappa] slug mancante per', code, info.name, '— poligono non cliccabile');
    }
    gPoly.appendChild(p);
  });

  // ---- figure stilizzate ----
  var gLines = el('g', {'class':'lines', 'clip-path':'url(#clip-circle)'});
  svg.appendChild(gLines);
  Object.keys(L).forEach(function(code){
    var segs = L[code];
    for (var i=0;i<segs.length;i++){
      if (segs[i].length < 2) continue;
      gLines.appendChild(el('path', {d: linePath([segs[i]])}));
    }
  });

  // ---- etichette costellazioni ----
  var gNames = el('g', {});
  svg.appendChild(gNames);
  codes.forEach(function(code){
    var c = centroid(B[code].poly);
    if (!c) return;
    var w = B[code].name.length * 5.6 + 6;
    gNames.appendChild(el('rect', {'class':'label-bg',
      x:f(c[0]-w/2), y:f(c[1]-6.5), width:f(w), height:13}));
    var t = el('text', {'class':'cname', x:f(c[0]), y:f(c[1]+3)});
    t.textContent = B[code].name;
    gNames.appendChild(t);
  });

  // ---- bordo doppio, tacche, etichette RA ----
  svg.appendChild(el('circle', {'class':'rim-outer', cx:CX, cy:CY, r:R}));
  svg.appendChild(el('circle', {'class':'rim-inner', cx:CX, cy:CY, r:R-5}));

  for (var m=0; m<360; m+=1){           // tacche fini ogni grado, grosse ogni ora
    var big = (m % 15 === 0);
    var r1 = R, r2 = R - (big ? 9 : 5);
    var s = Math.sin(m*D2R), c2 = Math.cos(m*D2R);
    svg.appendChild(el('line', {'class':'tick',
      x1:f(CX - r1*s), y1:f(CY - r1*c2), x2:f(CX - r2*s), y2:f(CY - r2*c2)}));
  }
  for (var hl=0; hl<24; hl+=2){          // etichette ogni 2h
    var th = hl*15*D2R;
    var rr = R + 26;
    var tx = CX - rr*Math.sin(th), ty = CY - rr*Math.cos(th);
    var lbl = el('text', {'class':'ralabel', x:f(tx), y:f(ty+5), 'text-anchor':'middle'});
    lbl.textContent = hl + 'h';
    svg.appendChild(lbl);
  }

  // ---- Polo Sud celeste ----
  svg.appendChild(el('circle', {'class':'pole-dot', cx:CX, cy:CY, r:2.5}));
  var pole = el('text', {'class':'pole-label', x:CX, y:CY+16});
  pole.textContent = 'Polo Sud Celeste';
  svg.appendChild(pole);
})();
</script>
</body>
</html>
