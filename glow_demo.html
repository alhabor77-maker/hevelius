<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo glow · Croce del Sud · Hevelius 1690</title>
<meta name="description" content="Prototipo di evidenziazione luminosa della costellazione corrente sulla tavola condivisa Fig. XX (Centauro + Croce del Sud).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --pergamena: #f4ecd8;
  --inchiostro: #5a4632;
  --oro: #e6c97a;
  --oro-chiaro: #f6e3ae;
  --notte-0: #050a1a;
  --notte-1: #0a1430;
  --notte-2: #101d44;
  --oro-classico: #d4af6a;
  --radius: 10px;
  --font-serif: 'Cormorant Garamond', 'EB Garamond', Garamond, Georgia, serif;
  --font-body: 'EB Garamond', 'Cormorant Garamond', Garamond, Georgia, serif;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 19px;
  line-height: 1.6;
  color: var(--pergamena);
  background:
    radial-gradient(1200px 600px at 20% -5%, #16264f 0%, transparent 60%),
    radial-gradient(900px 500px at 90% 10%, #1a2a5c 0%, transparent 55%),
    var(--notte-0);
  min-height: 100vh;
}
.site-header {
  background: linear-gradient(180deg, var(--notte-1) 0%, var(--notte-2) 100%);
  border-bottom: 1px solid rgba(212, 175, 106, .45);
  padding: 1.1rem 1.5rem;
  display: flex;
  align-items: baseline;
  gap: .8rem;
  flex-wrap: wrap;
}
.site-header .brand {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 1.5rem;
  color: var(--oro-classico);
  letter-spacing: .02em;
}
.site-header .sub { color: #a9adc0; font-size: .95rem; }
main.wrap { max-width: 1180px; margin: 0 auto; padding: 1.4rem 1rem 3rem; }
h1.page-title {
  font-family: var(--font-serif);
  color: var(--oro-classico);
  font-size: 2rem;
  margin: .4rem 0 .3rem;
}
p.lead { color: #c9cdd8; margin: 0 0 1.2rem; max-width: 62ch; }

/* toolbar in stile sito */
.toolbar {
  display: flex;
  align-items: center;
  gap: .6rem;
  flex-wrap: wrap;
  margin: 0 0 .8rem;
}
.toolbar .btn {
  font-family: var(--font-body);
  font-size: .95rem;
  padding: .45rem 1rem;
  border-radius: 8px;
  border: 1px solid rgba(212, 175, 106, .45);
  background: #101d44;
  color: #e9e4d4;
  cursor: pointer;
  transition: background .2s, color .2s;
}
.toolbar .btn:hover { background: var(--oro-classico); color: var(--notte-0); }
.toolbar .btn[aria-pressed="true"] {
  background: var(--oro-classico);
  color: var(--notte-0);
  font-weight: 600;
}
.toolbar .hint { color: #a9adc0; font-size: .9rem; }

/* viewport tavola: coerente col sito ma con il limite richiesto per la demo */
.plate-viewport {
  position: relative;
  overflow: auto;
  max-height: calc(100vh - 300px);
  border: 1px solid rgba(212, 175, 106, .45);
  border-radius: var(--radius);
  background: var(--pergamena);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .6);
}
.plate-inner { position: relative; width: 100%; line-height: 0; }
.plate-inner > img { width: 100%; height: auto; display: block; }
.plate-inner > svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* etichetta zona */
.zone-caption {
  margin-top: .7rem;
  font-family: var(--font-serif);
  font-size: 1.25rem;
  color: var(--oro-chiaro);
  text-align: center;
}
.notice { padding: .8rem 1rem; border: 1px solid rgba(212,175,106,.45); border-radius: 8px; background: rgba(212,175,106,.08); color: #e9e4d4; font-size: .95rem; }
</style>
</head>
<body>
<header class="site-header">
  <span class="brand">Hevelius · Firmamentum Sobiescianum</span>
  <span class="hint" style="color:#a9adc0">Demo: evidenziazione luminosa della costellazione corrente</span>
</header>
<main class="wrap">
  <h1 class="page-title">Croce del Sud — tavola Fig. XX</h1>
  <p class="zone-caption" id="zone-caption">Zona evidenziata: <strong>Crux</strong> — Croce del Sud <span class="sub" style="color:#a9adc0">(tavola condivisa col Centauro)</span></p>
  <div class="toolbar" id="toolbar">
    <button class="btn" type="button" data-intensity="soffuso" aria-pressed="true">Soffuso</button>
    <button class="btn" type="button" data-intensity="medio" aria-pressed="false">Medio</button>
    <button class="btn" type="button" data-intensity="forte" aria-pressed="false">Forte</button>
    <button class="btn" id="toggle-glow" type="button" aria-pressed="true">Nascondi evidenziazione</button>
  </div>
  <div class="plate-viewport" id="viewport">
    <div class="plate-inner" id="plate">
      <img id="plate-img" alt="Tavola Fig. XX del Firmamentum Sobiescianum di Hevelius (1690): Centaurus et Crux" src="https://commons.wikimedia.org/wiki/Special:FilePath/Centaurus_et_Crux_-_Prodromus_astronomiae_1690_(5590647).jpg?width=1920">
      <svg id="glow-svg" viewBox="0 0 1000 795" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <filter id="gblur" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="26"></feGaussianBlur>
          </filter>
        </defs>
        <g id="glow-layer" style="mix-blend-mode: screen;"></g>
      </svg>
    </div>
  </div>
  <p class="notice" id="data-note" hidden></p>
</main>
<script>
(function () {
  'use strict';
  /* Stelle della Croce del Sud: posizioni misurate sulla tavola Fig. XX.
     Cinque su sei derivano da verifica visiva sull'immagine (fit geometrico con
     le distanze angolari reali tra le stelle), mu_crucis APPROSSIMATA:
     vedi modifica.md. Le posizioni sono % sull'immagine piena (1920x1526). */
  var STELLE = [
    { id: 'acrux',      nome: 'Acrux',       x: 39.2, y: 75.0, r: 1.6 },
    { id: 'mimosa',     nome: 'Mimosa',      x: 45.4, y: 76.3, r: 1.3 },
    { id: 'gacrux',     nome: 'Gacrux',      x: 45.9, y: 82.6, r: 1.2 },
    { id: 'imai',       nome: 'Imai',        x: 41.2, y: 82.6, r: 1.2 },
    { id: 'ginan',      nome: 'Ginan',       x: 38.6, y: 79.3, r: 1.1 },
    { id: 'mu_crucis',  nome: 'Mu Crucis',   x: 47.3, y: 82.0, r: 1.0 }
  ];
  /* Tre intensità: raggio dei cerchi e opacità del bagliore */
  var INTENSITA = {
    soffuso: { blur: 34, alpha: 0.30, ring: 2.6 },
    medio:   { blur: 20, alpha: 0.48, ring: 3.4 },
    forte:   { blur: 13, alpha: 0.68, ring: 4.4 }
  };
  var GOLD = 'rgba(230,201,122,';

  var svg = document.getElementById('glow-svg');
  var img = document.getElementById('plate-img');
  var layer = document.getElementById('glow-layer');
  var intensity = 'soffuso';
  var visible = true;

  function dims() {
    var w = (img && img.naturalWidth) || 1920;
    var h = (img && img.naturalHeight) || 1526;
    return { W: 1000, H: 1000 * h / w };
  }

  function draw() {
    if (!layer) return;
    var d = dims();
    var cfg = INTENSITA[intensity];
    var parts = STELLE.map(function (s) {
      var cx = (s.x / 100) * d.W;
      var cy = (s.y / 100) * d.H;
      var r = (s.r * cfg.ring) * 10;
      return '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + r.toFixed(1) +
             '" fill="' + GOLD + (cfg.alpha * 0.9).toFixed(3) + ')" filter="url(#gblur)"/>';
    }).join('');
    layer.innerHTML = parts;
    /* alone diffuso attorno all'intera zona della Croce */
    var xs = STELLE.map(function (s) { return (s.x / 100) * d.W; });
    var ys = STELLE.map(function (s) { return (s.y / 100) * d.H; });
    var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
    var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
    var pad = 70;
    var path = 'M ' + (minX - pad).toFixed(1) + ' ' + (minY - pad).toFixed(1) +
               ' H ' + (maxX + pad).toFixed(1) +
               ' V ' + (maxY + pad).toFixed(1) +
               ' H ' + (minX - pad).toFixed(1) + ' Z';
    var alone = '<rect x="' + (minX - pad).toFixed(1) + '" y="' + (minY - pad).toFixed(1) +
                '" width="' + (maxX - minX + 2 * pad).toFixed(1) +
                '" height="' + (maxY - minY + 2 * pad).toFixed(1) +
                '" rx="90" fill="' + GOLD + (cfg.alpha * 0.45).toFixed(3) +
                '" filter="url(#gblur2)"/>';
    layer.innerHTML = parts + alone;
  }

  function setIntensity(name) {
    intensity = name;
    var cfg = INTENSITA[name];
    var b1 = document.getElementById('gblur');
    var b2 = document.getElementById('gblur2');
    if (b1) b1.querySelector('feGaussianBlur').setAttribute('stdDeviation', String(cfg.blur));
    if (b2) b2.querySelector('feGaussianBlur').setAttribute('stdDeviation', String(cfg.blur * 1.8));
    Array.prototype.forEach.call(document.querySelectorAll('#toolbar .btn[data-intensity]'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-intensity') === name));
    });
    draw();
  }

  function setVisibility(v) {
    visible = v;
    layer.style.display = v ? '' : 'none';
    var btn = document.getElementById('toggle-glow');
    if (btn) {
      btn.setAttribute('aria-pressed', String(v));
      btn.textContent = v ? 'Nascondi evidenziazione' : 'Mostra evidenziazione';
    }
  }

  Array.prototype.forEach.call(document.querySelectorAll('#toolbar .btn[data-intensity]'), function (b) {
    b.addEventListener('click', function () { setIntensity(b.getAttribute('data-intensity')); });
  });
  var toggle = document.getElementById('toggle-glow');
  if (toggle) toggle.addEventListener('click', function () { setVisibility(!visible); });

  /* filtri: uno per i punti, uno piu' largo per l'alone di zona */
  var defs = svg.querySelector('defs');
  defs.innerHTML =
    '<filter id="gblur" x="-60%" y="-60%" width="220%" height="220%">' +
      '<feGaussianBlur stdDeviation="26"/>' +
    '</filter>' +
    '<filter id="gblur2" x="-60%" y="-60%" width="220%" height="220%">' +
      '<feGaussianBlur stdDeviation="55"/>' +
    '</filter>';
  if (img) {
    if (!img.complete || !img.naturalWidth) {
      img.addEventListener('load', function () { draw(); });
      img.addEventListener('error', function () {
        var vp = document.getElementById('viewport');
        if (vp) vp.innerHTML = '<p class="notice">Impossibile caricare l\u2019immagine della tavola.</p>';
      });
    }
  }
  window.addEventListener('resize', draw);
  setIntensity('soffuso');
  if (img && img.complete && img.naturalWidth) draw();
})();
</script>
</body>
</html>
